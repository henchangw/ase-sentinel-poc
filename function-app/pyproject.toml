[project]
name = "sentinel-waf-block"
version = "1.0.0"
description = "Decision engine for the ASE Sentinel WAF auto-block playbook"
requires-python = ">=3.11"
dependencies = [
  "azure-functions>=1.21.0",
  "azure-identity>=1.19.0",
  "requests>=2.32.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
